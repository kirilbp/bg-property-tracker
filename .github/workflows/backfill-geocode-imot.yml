# Fills in lat/lng for imot.bg listings the nationwide scraper left
# uncoordinated (see backfill_geocode_imot.py and scraper_imot.py's
# module docstring for why: live geocoding at nationwide scale doesn't fit
# in the scrape itself). Each run processes a bounded chunk
# (MAX_LOOKUPS_PER_RUN), not everything at once. Shares scrape.yml's
# concurrency group since both write to data/*.json and commit.
#
# Was workflow_dispatch-only - never actually re-run by hand at any real
# volume, contributing to the site's "Others" province bucket (same root
# cause as backfill-geocode-homes.yml - see its own comment for the full
# story). Scheduled hourly now, matching the other backfills.
on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # scraper_imot.py imports playwright at module load even though this
      # backfill never launches a browser - omitting it crashes every run.
      - run: pip install requests playwright

      - run: python backfill_geocode_imot.py
        timeout-minutes: 45

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill imot.bg listing coordinates"
          git pull --rebase origin main
          git push
