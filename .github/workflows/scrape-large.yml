# scraper.py (imoti.net) and scraper_alo.py (alo.bg) each cover thousands
# of listings across 300+ paginated requests, so they run here on their
# own 24h schedule instead of in the main 6-hourly scrape.yml. Both also
# now visit every tracked listing's own page once per run to read a real
# posted/updated date for days-on-market - for imoti.net (~6000 listings)
# that alone adds ~2+ hours, so a full run here is a couple of hours, not
# minutes. Still comfortably inside GitHub Actions' default 6h job limit
# (no timeout-minutes is set below), but not "several minutes" anymore.
name: Scrape large property listing sites

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# scrape.yml carries the same group and guard for the same reason: a run
# here takes hours (this file's own comment above), long enough that a
# scrape.yml run or a direct push to main (a PR merge) can easily land in
# the meantime and produce a real git conflict on the shared data/*.json
# files with no fallback otherwise.
concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 Pillow

      - run: python scraper.py

      - run: python scraper_alo.py

      # Extends detect_relistings.py's relisting-chain mechanism (already
      # wired into scrape.yml) to these two portals specifically, using
      # real photo comparison instead of URL matching since imoti.net's
      # and alo.bg's stored photo URLs can't be string-matched (see
      # detect_relistings_by_photo.py's docstring). Downloads only a
      # locally-narrowed candidate set's photos, not the full active pool.
      - run: python detect_relistings_by_photo.py

      # See scrape.yml for why this falls back instead of just failing on
      # conflict: a run here can easily take 2+ hours, long enough for a
      # real content conflict against main to be likely, not a rare edge
      # case - and with no fallback, losing the rebase means losing this
      # entire run's scraped data for both portals, not just whichever
      # file happened to conflict.
      - run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update listings (large sites)"
          if ! git pull --rebase origin main; then
            echo "Rebase hit a content conflict - keeping main's version of the conflicted files and continuing"
            git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
            git diff --name-only --diff-filter=U | xargs -r git add
            GIT_EDITOR=true git rebase --continue
          fi
          git push
