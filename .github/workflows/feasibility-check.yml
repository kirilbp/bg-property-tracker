name: Feasibility check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python scraper_alo.py

      - run: python -c "import json; leads = json.load(open('data/leads_alo.json')); [print(l['id'], '->', repr(l['area'])) for l in leads]"
