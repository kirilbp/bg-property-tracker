name: Feasibility check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python scraper_imoti_bg.py

      - run: cat data/leads_imoti_bg.json

      - name: Apartment-filtering sanity check
        run: |
          python3 -c "
          import json, re
          leads = json.load(open('data/leads_imoti_bg.json'))
          print(f'total leads: {len(leads)}')
          apt_slugs = ['едностаен-апартамент', 'двустаен-апартамент', 'тристаен-апартамент', 'четиристаен-апартамент', 'многостаен', 'мезонет']
          bad = [l for l in leads if not any(s in l['url'] for s in apt_slugs)]
          print(f'listings NOT matching an apartment-type URL slug: {len(bad)}')
          for l in bad[:20]:
              print('  SUSPECT:', l['id'], l['url'])
          sofia_fallback = sum(1 for l in leads if l['area'] == 'Sofia')
          print(f'area=Sofia fallback count: {sofia_fallback}')
          photo_null = sum(1 for l in leads if l['photo'] is None)
          print(f'photo null count: {photo_null} / {len(leads)}')
          areas = set(l['area'] for l in leads)
          print('unique areas:', len(areas))
          print('sample areas:', list(areas)[:15])
          "
