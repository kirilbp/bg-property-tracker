# Temporary diagnostic workflow: checks two genuinely untried angles before
# concluding the price-history investigation has hit its real ceiling -
# Common Crawl (a separate web archive from Wayback) and deeper pagination
# of imot.bg/bazar.bg's archived search results (only page 1 was ever
# checked). Read-only, no commit step. Delete once the question is
# answered.
name: Probe final historical-data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_final_sources.py
