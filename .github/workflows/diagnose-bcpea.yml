# Temporary diagnostic workflow: runs only scraper_bcpea.py so a live run
# takes ~1-2 minutes instead of the ~65 minutes a full scrape.yml run costs
# (most of that is scraper_bazar.py's per-listing detail crawl, unrelated to
# bcpea). Delete once sales.bcpea.org's live pagination/detail-fetch
# behavior is understood and scraper_bcpea.py is confirmed stable.
name: Diagnose scraper_bcpea.py

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python scraper_bcpea.py
