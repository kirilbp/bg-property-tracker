# Temporary diagnostic workflow: checks whether any of our source portals
# expose a listing's original/reduced price directly on its own page (a
# "price reduced" badge, struck-through old price, embedded price history,
# etc.) - a real, portal-native source of pre-tracking price history, if it
# exists. Read-only, no commit step. Delete once the question is answered.
name: Probe portal price-reduction signals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_price_badges.py
