# One-time, throwaway verification - NOT meant to stay in the repo.
# Checks whether imoti.net's own "N bedroom" English title text really
# means "N+1" in the Bulgarian "N-стаен" room-count convention used
# everywhere else in this project (index.html's extractRoomCount() adds 1
# to convert it). This sandbox's own outbound network policy blocks a
# direct fetch to imoti.net, but GitHub Actions runners (which the real
# scrapers already run on) can reach it - this reuses that access for a
# real page-content check rather than trusting the URL slug alone.
# Delete this workflow once its result is confirmed and reported.
name: Verify imoti.net room-count conversion (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: |
          python3 - <<'PYEOF'
          import json, re
          import requests
          from bs4 import BeautifulSoup

          # Round 2: round 1's plain-text search for a Cyrillic room-word came
          # up empty on 19/20 of these EN-language (/en/obiava/...) pages -
          # inconclusive, not necessarily wrong, since the /en/ page may just
          # not display that word in visible copy at all even though the
          # portal's own URL slug states it. This dumps the actual property-
          # details area of a few real pages verbatim so it can be read
          # directly, rather than guessing at another substring pattern.
          urls = [
              "https://www.imoti.net/en/obiava/prodava/varna/briz/tristaen/6226556/",
              "https://www.imoti.net/en/obiava/prodava/sofia/pavlovo/dvustaen/6255952/",
              "https://www.imoti.net/en/obiava/prodava/vratsa/podbalkanska/chetiristaen/6231617/",
          ]
          headers = {"User-Agent": "Mozilla/5.0 (compatible; PersonalDealTracker/1.0)"}

          for url in urls:
              print(f"\n{'='*100}\n{url}\n{'='*100}")
              try:
                  resp = requests.get(url, headers=headers, timeout=20)
                  resp.raise_for_status()
                  html = resp.text
                  soup = BeautifulSoup(html, "html.parser")

                  # Bulgarian-language alternate link, if the site publishes one -
                  # its own URL would show the room word in the language the
                  # portal's own users actually search it in.
                  bg_alt = soup.find("link", attrs={"hreflang": "bg"})
                  print("hreflang=bg alternate:", bg_alt.get("href") if bg_alt else None)

                  # Any breadcrumb nav - often states property type/room count.
                  breadcrumb = soup.find(class_=re.compile("breadcrumb", re.I))
                  if breadcrumb:
                      print("breadcrumb text:", breadcrumb.get_text(" | ", strip=True)[:300])

                  # The page's own <title> and og:title often restate the type.
                  print("title tag:", soup.title.get_text(strip=True) if soup.title else None)
                  og_title = soup.find("meta", attrs={"property": "og:title"})
                  print("og:title:", og_title.get("content") if og_title else None)

                  # Raw visible text near any occurrence of "room" (English
                  # page) - print real surrounding context instead of a
                  # yes/no substring check.
                  page_text = soup.get_text(" ", strip=True)
                  for m in re.finditer(r"room", page_text, re.IGNORECASE):
                      start = max(0, m.start() - 80)
                      print("  ...context near 'room':", page_text[start:m.start()+80])
              except Exception as e:
                  print("ERROR:", e)
          PYEOF
