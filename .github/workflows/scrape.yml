# scraper.py (imoti.net) and scraper_alo.py (alo.bg) run separately in
# scrape-large.yml on a 24h schedule instead of here - both sites have
# ~10,000 listings across 300+ pages, so a full scrape run of either takes
# several minutes, too slow/heavy to bundle into this 6-hourly job.
name: Scrape property listings

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# A manual workflow_dispatch run overlapping the scheduled run raced to push
# to the same data/*.json files - the loser's "git pull --rebase" hit real
# content conflicts (both runs touch the same history files) and its entire
# push was lost, discarding every scraper's update for that run, not just
# whichever one happened to conflict. Queues instead of running two scrapes
# in parallel; cancel-in-progress stays false so a scrape already underway
# finishes rather than being killed mid-run and wasting the work done so far.
concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      # Each scraper step below gets its own timeout-minutes + continue-
      # on-error - a real production run once stalled on a single portal
      # for 2h40m+ with no way to tell whether it was still making
      # progress, and separately a single uncaught exception in one
      # scraper (scraper_homes.py crashing on a malformed price field)
      # skipped every step after it, including the final commit -
      # discarding every other portal's already-scraped data for that
      # run too. timeout-minutes bounds the first problem; continue-on-
      # error means a step that fails or times out still lets later
      # scrapers (and the commit/sync steps) run instead of cascading.
      # Limits are generous multiples of each portal's normal runtime.
      - run: python scraper_homes.py
        timeout-minutes: 60
        continue-on-error: true

      # Nationwide since 2026-08-25: 24 cities each individually paginated
      # (city slicing - see scraper_imot.py's module docstring for why no
      # single nationwide switch exists) instead of Sofia-only's ~1-3
      # pages, so this needs real headroom over the old 20-minute cap.
      - run: python scraper_imot.py
        timeout-minutes: 60
        continue-on-error: true

      # Nationwide since 2026-08-25: 26 oblasts each individually paginated
      # (oblast slicing - see scraper_olx.py's module docstring for why the
      # bare nationwide URL alone isn't enough) instead of Sofia-only's
      # single region, so this needs real headroom over the old 20-minute
      # cap.
      - run: python scraper_olx.py
        timeout-minutes: 60
        continue-on-error: true

      # Nationwide since 2026-08-25: 29 cities each individually paginated
      # (city slicing - see scraper_bazar.py's module docstring for why)
      # instead of Sofia-only's single region, but detail-page coordinate
      # fetching is now decoupled into backfill_detail_bazar.py, so the
      # existing 90-minute cap still has real headroom despite the wider
      # city coverage.
      - run: python scraper_bazar.py
        timeout-minutes: 90
        continue-on-error: true

      - run: python scraper_imoti_bg.py
        timeout-minutes: 60
        continue-on-error: true

      # Detail-page fetching (district/photo/coordinates) is now decoupled
      # into backfill_detail_bcpea.py, so this step is grid-crawl only and
      # the 30-minute cap is now generous headroom rather than routinely
      # getting hit.
      - run: python scraper_bcpea.py
        timeout-minutes: 30
        continue-on-error: true

      # Runs after every scrape so newly-detected relistings (a seller
      # deleting and reposting a listing, often at a lower price, instead
      # of editing it in place) get chained together as soon as they
      # appear - purely local analysis of data already scraped above, no
      # network access needed. Safe to run every time: already-recorded
      # pairs are skipped, not re-injected.
      - run: python detect_relistings.py
        timeout-minutes: 10
        continue-on-error: true

      # The concurrency group above only serializes runs of this workflow
      # against each other - it does nothing about a push landing on main
      # through a completely different path (a PR merge) while a long
      # scrape is in flight. That happened for real: a run that took ~75
      # minutes (bazar.bg responding slowly) hit real content conflicts in
      # data/leads_bazar.json and data/leads_imot.json against commits
      # merged to main during that window, and with no fallback the whole
      # run's freshly-scraped data for every portal was discarded when the
      # rebase failed and the runner was torn down - not just the two
      # conflicted files. On conflict, keep whatever is already on main
      # for just the conflicted files (this run's snapshot for those two
      # portals gets recaptured next cycle regardless) rather than losing
      # every portal's update over an unrelated conflict.
      #
      # if: always() - belt-and-suspenders alongside each scraper step's
      # own continue-on-error: true above; commits whatever's on disk
      # regardless of which steps succeeded.
      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update listings"
          if ! git pull --rebase origin main; then
            echo "Rebase hit a content conflict - keeping main's version of the conflicted files and continuing"
            git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
            git diff --name-only --diff-filter=U | xargs -r git add
            GIT_EDITOR=true git rebase --continue
          fi
          git push

      # Runs last, after the JSON commit/push above has already landed -
      # JSON stays the source of truth and safety net regardless of
      # whether this step succeeds. Reads all 8 leads_*.json files
      # currently on disk (this run's freshly-scraped subset plus
      # whatever was last committed for the portals scrape-large.yml
      # owns), since the cross-portal merge needs the full picture, not
      # just what this particular workflow scraped.
      - if: always()
        run: python sync_to_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
