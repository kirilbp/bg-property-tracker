# scraper.py (imoti.net) and scraper_alo.py (alo.bg) run separately in
# scrape-large.yml on a 24h schedule instead of here - both sites have
# ~10,000 listings across 300+ pages, so a full scrape run of either takes
# several minutes, too slow/heavy to bundle into this 6-hourly job.
name: Scrape property listings

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python scraper_homes.py

      - run: python scraper_imot.py

      - run: python scraper_olx.py

      - run: python scraper_bazar.py

      - run: python scraper_imoti_bg.py

      # sales.bcpea.org was never reachable from the sandbox this scraper was
      # developed in (network egress policy blocked the domain outright), so
      # unlike every other scraper here it was written from two saved HTML
      # pages rather than verified against the live site before merging.
      # continue-on-error so a crash on unexpected live markup can't block
      # the git-commit step below and silently discard every other
      # scraper's successful update for this run too - remove once a few
      # scheduled runs confirm it's stable.
      - run: python scraper_bcpea.py
        continue-on-error: true

      - run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update listings"
          git pull --rebase origin main
          git push
