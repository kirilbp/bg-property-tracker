name: Test scraper_olx.py pagination fix

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python scraper_olx.py
      - run: python -c "import json; h=json.load(open('data/history_olx.json')); print('unique listings in history:', len(h))"
