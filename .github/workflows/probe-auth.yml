# Throwaway diagnostic ("login still doesn't work" investigation) - see
# probe_auth.py. Run once via workflow_dispatch on GitHub's own network
# (this sandbox's egress proxy denies CONNECT to *.supabase.co outright),
# read the job logs, then this workflow and the script get deleted - same
# pattern as every other one-off probe this project has used.
name: Probe Supabase Auth reachability (throwaway diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_auth.py
