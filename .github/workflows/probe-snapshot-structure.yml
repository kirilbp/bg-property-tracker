# Temporary diagnostic workflow: the Wayback backfill parsed 0 listings from
# every imot.bg archived snapshot even after fixing the id regex, despite
# proven real overlap existing in that same raw HTML via a simpler
# whole-text search. This checks exactly where the listing IDs actually
# live in one real snapshot before guessing at a third fix. Read-only, no
# commit step. Delete once the question is answered.
name: Probe Wayback snapshot structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_snapshot_structure.py
