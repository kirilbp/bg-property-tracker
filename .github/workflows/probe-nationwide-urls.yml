# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses - most
# recently a real headless-browser load of the live site confirming that
# no longer bulk-fetching listing_sources fixed a real statement-timeout
# failure three narrower fixes - retries, index-matching sort order,
# dropping the heaviest JSON columns - each failed to resolve on their
# own: 32.4s, zero console errors, real per-portal counts, after each of
# those three had individually still failed the same live test). Kept
# registered (workflow_dispatch runs against this branch pick up whatever
# it's currently pointed at, no need to merge a placeholder to main
# first) so a future diagnostic round can just overwrite the script below
# instead of re-registering a new workflow name. No probe script
# currently checked in - repoint the run step at a new one when the next
# question comes up.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests
      - run: python probe_city_area_audit.py
