# Temporary diagnostic workflow: finds homes.bg's real "all of Bulgaria,
# all property types" mechanism before rewriting scraper_homes.py for the
# nationwide expansion - its homepage embeds an explicit searchCriteria
# object ({"ApartmentSell": ..., "locationId": "София"}) even with no
# query params on the URL, so guessing at a param name risks silently
# still scraping Sofia apartments under a different-looking URL. Read-
# only, no commit step. Delete once the question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_homes_nationwide.py
