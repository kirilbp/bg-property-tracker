# Temporary diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for prior uses). Currently
# checking why the production imoti.bg scraper (nationwide, no page cap)
# is only returning 801 listings total - a real small portal, or
# pagination stopping early for some other reason. Read-only, no commit
# step. Delete once the current probe's question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_imoti_bg_total.py
