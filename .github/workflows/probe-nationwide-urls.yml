# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses - most
# recently quantifying real lat/lng coverage after a radius-mode lead
# generator centered on a small town returned zero matches: only 20.7% of
# all 244,217 listings have real coordinates, ranging 9.6% (imoti.net) to
# 62.5% (imoti.bg) by portal - a genuine, dataset-wide coverage gap, not a
# city/area-allocation bug; index.html's zero-radius-results message was
# fixed to say so instead of looking identical to "something's broken").
# Kept registered (workflow_dispatch runs against this branch pick up
# whatever it's currently pointed at, no need to merge a placeholder to
# main first) so a future diagnostic round can just overwrite the script
# below instead of re-registering a new workflow name. No probe script
# currently checked in - repoint the run step at a new one when the next
# question comes up.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: echo "Dormant - no probe script currently checked in."
