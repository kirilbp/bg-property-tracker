# Diagnostic workflow, repurposed round-by-round throughout the nationwide
# expansion (see git history for many prior uses). Currently checking
# alo.bg's real nationwide URL mechanism and whether deep pagination hits
# a homes.bg/imoti.net-style depth cap. Read-only, no commit step. Delete
# once the current probe's question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_alo_deep_pages.py
