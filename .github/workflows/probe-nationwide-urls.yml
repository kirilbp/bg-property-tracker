# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses - most
# recently confirming which portals' detail pages expose a full photo
# gallery vs. just the single thumbnail already stored: imot.bg (dedup
# duplicate-slash CDN URLs), bazar.bg (ld+json "image" array), imoti.net
# (numbered image files), and alo.bg (fancybox gallery anchors) all do;
# imoti.bg genuinely doesn't (one photo only, confirmed on both a land
# parcel and an apartment sample) - see geo_utils.py's extract_photos_*
# functions and each portal's scraper/backfill script for the extraction
# this fed into).
# Kept registered (workflow_dispatch runs against this branch pick up
# whatever it's currently pointed at, no need to merge a placeholder to
# main first) so a future diagnostic round can just overwrite the script
# below instead of re-registering a new workflow name. No probe script
# currently checked in - repoint the run step at a new one when the next
# question comes up.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: echo "Dormant - no probe script currently checked in."
