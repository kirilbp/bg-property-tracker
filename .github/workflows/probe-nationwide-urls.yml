# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses). Currently
# pointed at probe_postcodes.py - checking whether any portal's detail
# page exposes a postal code that could disambiguate a settlement name
# shared by more than one real place (e.g. "Бяла" - a real, different
# municipality in both Varna and Ruse oblasts - see
# backfill_others_geocode.py's own docstring for that specific case).
# Kept registered (workflow_dispatch runs against this branch pick up
# whatever it's currently pointed at, no need to merge a placeholder to
# main first) so a future diagnostic round can just overwrite the script
# below instead of re-registering a new workflow name.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_postcodes.py
        timeout-minutes: 10
