# Temporary diagnostic workflow: verifies a real candidate nationwide
# (all-Bulgaria) search URL for each of the 7 currently Sofia-scoped
# portals, before changing any production scraper - part of expanding
# tracking coverage from Sofia to all of Bulgaria. Read-only, no commit
# step. Delete once the question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_nationwide_urls.py
