# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses). Currently
# pointed at probe_floorplans.py - a one-shot investigation into whether
# any portal's detail page exposes a floor plan image separately from its
# regular photo gallery, ahead of task list item 6 ("investigate + add
# floor plan images to listing detail").
# Kept registered (workflow_dispatch runs against this branch pick up
# whatever it's currently pointed at, no need to merge a placeholder to
# main first) so a future diagnostic round can just overwrite the script
# below instead of re-registering a new workflow name.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_floorplans.py
        timeout-minutes: 10
