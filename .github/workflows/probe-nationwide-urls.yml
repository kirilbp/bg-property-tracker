# Temporary diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for prior uses). Currently
# checking whether the other 5 portals (alo.bg, bazar.bg, imot.bg, olx.bg,
# imoti.bg) have a fixed pagination depth cap like homes.bg's confirmed
# ~page-49 cutoff. Read-only, no commit step. Delete once the current
# probe's question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python probe_other_portals_cap.py
