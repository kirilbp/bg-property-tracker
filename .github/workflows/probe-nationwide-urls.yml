# Temporary: runs the real, unbounded nationwide scraper_homes.py (not a
# bounded sample) to verify actual runtime and full-scale data quality
# before merging it into scrape.yml's normal rotation, per the staged-
# rollout requirement (bounded verification already passed - see git
# history). Isolated from the other 5 scrapers scrape.yml runs so this
# run's timing/success is only about homes.bg. Has its own commit step
# (mirrors scrape.yml's conflict-handling) since this is meant to produce
# real, keepable data, not just read-only diagnostics. Delete once
# verified and merged.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scraper_homes.py

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Nationwide homes.bg scrape (verification run)"
          if ! git pull --rebase; then
            echo "Rebase hit a content conflict - keeping main's version of the conflicted files and continuing"
            git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
            git diff --name-only --diff-filter=U | xargs -r git add
            GIT_EDITOR=true git rebase --continue
          fi
          git push
