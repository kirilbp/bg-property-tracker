# Temporary diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for prior uses on homes.bg's
# nationwide/type-selector mechanism). Currently running a bounded
# verification of the rewritten scraper_homes.py before letting it run
# unbounded, per the staged-rollout requirement. Read-only, no commit
# step. Delete once the current probe's question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_homes_bounded.py
