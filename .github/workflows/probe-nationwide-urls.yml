# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses). Currently
# pointed at probe_oblast_live.py, live-browser-verifying the new "Others"
# city bucket + "Browse by Council" oblast section post-sync (CORS/DB
# failures only ever show up to a real browser, never a raw HTTP probe -
# same reasoning as every prior round). Kept registered (workflow_dispatch
# runs against this branch pick up whatever it's currently pointed at, no
# need to merge a placeholder to main first) so a future diagnostic round
# can just overwrite the script below instead of re-registering a new
# workflow name.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install playwright && playwright install --with-deps chromium

      - run: python probe_oblast_live.py
