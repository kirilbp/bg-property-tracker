# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses - most
# recently comparing the frontend's displayed city counts against a direct
# Supabase query, which found the frontend was silently recomputing city
# from title text instead of using the already-correct city_key column -
# fixed in index.html's listingCityKey()). Kept registered (workflow_
# dispatch runs against this branch pick up whatever it's currently
# pointed at, no need to merge a placeholder to main first) so a future
# diagnostic round can just overwrite the script below instead of
# re-registering a new workflow name. No probe script currently checked
# in - repoint the run step at a new one when the next question comes up.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_imoti_net_decoupled.py
