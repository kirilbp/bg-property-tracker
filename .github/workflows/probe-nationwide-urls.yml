# Temporary diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for prior uses). Currently a
# bounded live verification (LandAgro only) of the new price-band-
# bisection fetch_listings() in scraper_homes.py, before it goes into the
# real scrape.yml rotation. Read-only, no commit step. Delete once the
# current probe's question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_verify_homes_slicing.py
