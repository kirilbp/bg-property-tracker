# Diagnostic workflow, repurposed round-by-round throughout the nationwide
# expansion (see git history for many prior uses). Currently checking
# imoti.net's real nationwide URL and whether its confirmed page-200 block
# is per-query (like homes.bg's, fixable via slicing) or session-wide
# (not fixable via slicing). Read-only, no commit step. Delete once the
# current probe's question is answered.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_imoti_net_city_slugs.py
