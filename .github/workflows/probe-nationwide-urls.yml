# Dormant diagnostic workflow, repurposed round-by-round throughout the
# nationwide expansion (see git history for many prior uses - most
# recently root-causing why a Cherven Bryag radius search found nothing
# despite real listings existing there on multiple portals: a single bad
# entry in data/geocode_cache.json - "Червен бряг, Ловеч, България" -
# geocoded to a location ~62km from the real town, because at least 3
# portals' own listing pages pair this settlement with "Ловеч" as its
# city/region (a real quirk of those sites' own categorization, not a
# scraper bug), and that combined query string resolved wrong. The same
# bad cached value had silently propagated to every listing across
# imot.bg (12), imoti.bg (1), and one genuine olx.bg listing that used it
# - fixed by correcting the cache entry and every already-synced
# listing's lat/lng to match the town's real, already-correctly-cached
# standalone coordinates ("Червен бряг, България").
# Kept registered (workflow_dispatch runs against this branch pick up
# whatever it's currently pointed at, no need to merge a placeholder to
# main first) so a future diagnostic round can just overwrite the script
# below instead of re-registering a new workflow name. No probe script
# currently checked in - repoint the run step at a new one when the next
# question comes up.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: echo "Dormant - no probe script currently checked in."
