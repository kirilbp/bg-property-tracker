# Dormant diagnostic workflow, repurposed round-by-round (see git history
# for many prior uses). Currently pointed at probe_photos.py - a one-shot
# investigation into whether each portal's detail page exposes a full
# photo gallery (not just the single thumbnail already stored in the
# "photo" field), ahead of adding full photo galleries to the listing
# detail page (index.html's detail view already renders a photos[] array
# with thumbnails/main-photo swap when present - see the "photos" field
# homes.bg already populates - this is about wiring the other 7 portals
# up to the same field).
# Kept registered (workflow_dispatch runs against this branch pick up
# whatever it's currently pointed at, no need to merge a placeholder to
# main first) so a future diagnostic round can just overwrite the script
# below instead of re-registering a new workflow name.
name: Probe nationwide search URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_photos_round2.py
        timeout-minutes: 10
