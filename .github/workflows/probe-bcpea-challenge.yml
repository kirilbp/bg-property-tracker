# Temporary diagnostic workflow: scraper_bcpea.py has been stuck at
# exactly 36 listings (one page) since it was first built - the site's
# bot-challenge clears for the first request in a session but never
# clears for any request after that. Tests several concrete candidate
# fixes (stealth flags, a fresh browser context per request, slower
# pacing) against the real site before changing the production scraper.
# Read-only, no commit step. Delete once the question is answered.
name: Probe bcpea.org bot-challenge fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python probe_bcpea_challenge.py
