# Temporary diagnostic workflow: measures how much Wayback Machine
# coverage our tracked listing URLs actually have, before any real
# backfill-parsing logic gets built and trusted against archived HTML none
# of us have seen yet. Read-only, no commit step. Delete once the
# coverage question is answered and a decision is made either way.
name: Probe Wayback Machine coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python wayback_probe.py
