# Throwaway diagnostic ("login rejects real credentials" / possible
# wrong-Supabase-project investigation) - see probe_auth_project.py. Run
# once via workflow_dispatch on GitHub's network (this sandbox's egress
# proxy denies CONNECT to *.supabase.co outright), read the job logs, then
# this workflow and the script get deleted - same pattern as every other
# one-off probe this project has used.
name: Probe Supabase project identity (throwaway diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_auth_project.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
