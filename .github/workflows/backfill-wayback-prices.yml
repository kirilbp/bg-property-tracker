# One-time backfill (see backfill_wayback_prices.py for the full rationale
# and how it was arrived at): injects real pre-tracking price history for
# imot.bg and bazar.bg listings from Wayback Machine captures of each
# portal's search page, confirmed to have real overlap with our currently
# tracked listings. workflow_dispatch only - not scheduled, since Wayback
# doesn't crawl more often just because this re-runs. Shares scrape.yml's
# concurrency group since both write to data/*.json and commit.
name: Backfill Wayback price history

on:
  workflow_dispatch:

concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python backfill_wayback_prices.py

      # if: always() - a prior run computed and wrote 34 real injected
      # snapshots to the history files, then crashed on an unrelated step
      # (a missing playwright import) before this commit step ever ran,
      # silently losing that real work when the runner was torn down.
      # Committing whatever was written to disk regardless of what
      # happens later in the script is strictly safer than losing it.
      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill pre-tracking price history from Wayback Machine captures"
          git pull --rebase origin main
          git push
