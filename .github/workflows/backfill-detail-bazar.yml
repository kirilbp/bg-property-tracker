# Fills in lat/lng and description for bazar.bg listings the nationwide
# scraper left unenriched (see backfill_detail_bazar.py and
# scraper_bazar.py's module docstring for why: visiting every listing's
# own detail page at nationwide scale doesn't fit in the scrape itself).
# Previously workflow_dispatch-only (map coordinates alone didn't justify
# an hourly cron) - now scheduled hourly like the other detail backfills,
# since it also fills in description, real listing content users actually
# see. Shares scrape.yml's concurrency group since both write to
# data/*.json and commit.
name: Backfill bazar.bg listing details

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python backfill_detail_bazar.py
        timeout-minutes: 45

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill bazar.bg listing details"
          git pull --rebase origin main
          git push
