# Temporary diagnostic workflow, round 2: the first nationwide-scale check
# (nationwide-check.yml, removed once its output was reviewed) had a wrong
# imoti.net URL and unreliable count extraction for several portals. This
# corrects the URLs and cross-checks totals with a second signal before
# any nationwide-expansion work begins. Read-only, no commit step. Delete
# once the question is answered.
name: Probe nationwide URLs and field availability (round 2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install playwright
      - run: playwright install --with-deps chromium

      - run: python probe_nationwide_v2.py
