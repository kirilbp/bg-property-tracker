# Fills in lat/lng for imoti.bg listings the nationwide scraper left
# uncoordinated (see backfill_geocode_imoti_bg.py and
# scraper_imoti_bg.py's module docstring for why: a real nationwide
# production run took 4+ hours instead of ~35 minutes while geocoding was
# still live/in-line). Each run processes a bounded chunk
# (MAX_LOOKUPS_PER_RUN), not everything at once. Own dedicated
# concurrency group, not shared with scrape.yml or the other backfills -
# a shared group only ever keeps one *queued* run, so with this many
# hourly-ish backfill/geocode workflows funneling into one slot, a later
# schedule firing while an earlier one was still queued canceled it
# outright rather than just delaying it (confirmed live: runs were being
# canceled every few minutes). Any git push race with a concurrent
# scrape/backfill is already handled by the rebase-retry-with-ours
# fallback below, same as always.
#
# Was workflow_dispatch-only - never actually re-run by hand at any real
# volume, contributing to the site's "Others" province bucket (same root
# cause as backfill-geocode-homes.yml - see its own comment for the full
# story). Scheduled hourly now, matching the other backfills.
on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

concurrency:
  group: backfill-geocode-imoti-bg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python backfill_geocode_imoti_bg.py
        timeout-minutes: 45

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill imoti.bg listing coordinates"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              echo "Rebase hit a content conflict - keeping main's version of the conflicted files and continuing"
              git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
              git diff --name-only --diff-filter=U | xargs -r git add
              GIT_EDITOR=true git rebase --continue
            fi
            if git push; then
              pushed=true
              break
            fi
            echo "Push rejected (attempt $attempt/5) - another workflow likely pushed to main first now that backfills/scrapes run in parallel; re-pulling and retrying"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push after 5 attempts - giving up"
            exit 1
          fi
