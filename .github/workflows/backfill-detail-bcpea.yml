# Fills in district/photo/coordinates for sales.bcpea.org listings the
# main scrape left un-detail-checked (see backfill_detail_bcpea.py and
# scraper_bcpea.py's module docstring for why: visiting every listing's
# own page - a fresh browser context plus a live geocode call each -
# routinely blew through the scrape's 30-minute step timeout at ~1,300
# nationwide listings). Runs hourly like the other high-churn detail
# backfills (alo.bg, imoti.net) - a fresh full backlog clears in a few
# hours, after which each run only needs to keep up with that day's newly
# discovered listings. Shares scrape.yml's concurrency group since both
# write to data/*.json and commit.
name: Backfill bcpea.org listing details

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python backfill_detail_bcpea.py
        timeout-minutes: 45

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill bcpea.org listing details"
          git pull --rebase origin main
          git push
