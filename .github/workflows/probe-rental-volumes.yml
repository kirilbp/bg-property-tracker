# Throwaway diagnostic (rental-portal volume investigation, follow-up to
# probe-rental-sections.yml) - see probe_rental_volumes.py. Run once via
# workflow_dispatch on GitHub's own network, read the job logs, then this
# workflow and the script get deleted, same as the plain-HTTP pass before
# it and every other one-off probe this project has used.
name: Probe rental volumes via real browser (throwaway diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install playwright

      - run: |
          for attempt in 1 2 3; do
            if playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install failed (attempt $attempt/3), retrying"
            sleep $((attempt * 10))
          done
          echo "::error::playwright install --with-deps chromium failed after 3 attempts"
          exit 1

      - run: python probe_rental_volumes.py
