# One-time diagnostic for backlog item 6 (site slow to load/refresh) -
# measures the real payload-size difference between index.html's current
# `select('*')` bulk fetch of merged_listings and the narrowed column list
# proposed as the fix, against live Supabase data. This sandbox's egress
# proxy blocks direct Supabase access, so this runs the measurement from
# GitHub Actions instead, where the route is open - same reason
# verify-price-history-in-supabase.yml exists.
#
# Read-only (no data/ writes, no commit step) - just queries Supabase and
# prints the comparison to the job log. Not scheduled, run once by hand.
name: Measure listings payload size

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python measure_listings_payload.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
