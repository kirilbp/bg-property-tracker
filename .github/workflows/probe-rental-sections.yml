# Throwaway diagnostic (rental-portal volume investigation) - see
# probe_rental_sections.py. Run once via workflow_dispatch on GitHub's own
# network (this sandbox has no route to any of these hosts), read the job
# logs, then this workflow and the script get deleted - same pattern as
# every other one-off probe this project has used (e.g. the imoti.net
# room-count verification, the bcpea gallery probe).
name: Probe rental sections (throwaway diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_rental_sections.py
