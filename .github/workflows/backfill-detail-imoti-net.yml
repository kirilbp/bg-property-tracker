# Fills in site_posted_at/lat,lng for imoti.net listings the nationwide
# scraper left unenriched (see backfill_detail_imoti_net.py and
# scraper.py's module docstring for why: visiting every listing's own page
# no longer fits in the main scrape at nationwide scale - a real run timed
# out doing exactly that, discarding the whole run's freshly-scraped grid
# data too). Runs hourly like alo.bg's own detail backfill - a fresh full
# backlog is ~21,700 listings at 1,500/run, roughly 15 runs (under a day)
# to fully clear, then each run only needs to keep up with each day's
# newly-discovered listings, a much smaller number. Own dedicated
# concurrency group, not shared with scrape.yml/scrape-large.yml or the
# other backfills - a shared group only ever keeps one *queued* run, so
# with this many hourly-ish backfill/geocode workflows funneling into one
# slot, a later schedule firing while an earlier one was still queued
# canceled it outright rather than just delaying it (confirmed live: runs
# were being canceled every few minutes). Any git push race with a
# concurrent scrape/backfill is already handled by the rebase-retry-with-
# ours fallback below, same as always.
name: Backfill imoti.net listing details

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: backfill-detail-imoti-net
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python backfill_detail_imoti_net.py
        timeout-minutes: 45

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill imoti.net listing details"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              echo "Rebase hit a content conflict - keeping main's version of the conflicted files and continuing"
              git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
              git diff --name-only --diff-filter=U | xargs -r git add
              GIT_EDITOR=true git rebase --continue
            fi
            if git push; then
              pushed=true
              break
            fi
            echo "Push rejected (attempt $attempt/5) - another workflow likely pushed to main first now that backfills/scrapes run in parallel; re-pulling and retrying"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push after 5 attempts - giving up"
            exit 1
          fi
