name: TEMP test real-date fix

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bg-property-tracker-setup-30c2rp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python scraper_homes.py
      - run: python scraper_olx.py

      - run: python ../sample_results.py
        working-directory: .
