# Temporary diagnostic workflow: scraper_alo.py's photo field turns out to
# be the agent's avatar image, not the property, for 93.8% of currently
# tracked alo.bg listings (confirmed against committed data/leads_alo.json).
# Fetches real listing/grid pages to find out why, before fixing the real
# scraper. Read-only, no commit step. Delete once the question is answered.
name: Probe alo.bg photo selection bug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python probe_alo_photos.py
