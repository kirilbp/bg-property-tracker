# Fills in description for olx.bg listings the main scrape never visits
# the detail page for (see backfill_detail_olx.py and scraper_olx.py's
# fetch_listing_detail() for why: the grid crawl only ever fetched search
# result pages, never individual listings - the real description only
# lives on each listing's own page, as a ld+json block). Runs hourly like
# the other detail backfills - a fresh full backlog clears over a few days
# at this run's cap, after which each run only needs to keep up with that
# day's newly-discovered listings. Own dedicated concurrency group, not
# shared with scrape.yml or the other backfills - a shared group only
# ever keeps one *queued* run, so with this many hourly-ish backfill/
# geocode workflows funneling into one slot, a later schedule firing
# while an earlier one was still queued canceled it outright rather than
# just delaying it (confirmed live: runs were being canceled every few
# minutes). Any git push race with a concurrent scrape/backfill is
# already handled by the rebase-retry-with-ours fallback below, same as
# always.
name: Backfill olx.bg listing details

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

concurrency:
  group: backfill-detail-olx
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium

      - run: python backfill_detail_olx.py
        timeout-minutes: 45

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill olx.bg listing details"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              echo "Rebase hit a content conflict - keeping main's version of the conflicted files and continuing"
              git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
              git diff --name-only --diff-filter=U | xargs -r git add
              GIT_EDITOR=true git rebase --continue
            fi
            if git push; then
              pushed=true
              break
            fi
            echo "Push rejected (attempt $attempt/5) - another workflow likely pushed to main first now that backfills/scrapes run in parallel; re-pulling and retrying"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push after 5 attempts - giving up"
            exit 1
          fi
