# One-time correction pass (see verify_geocode_qualifiers.py's own
# docstring for the full story): re-checks every cached "<area>, <city>,
# България" geocode whose <city> isn't one of Bulgaria's 4 biggest cities
# against a live geocode of the bare settlement name, and corrects any
# entry (plus every listing across all 8 portals that shares the old,
# wrong coordinate) that disagrees by more than 30km - the same bug
# signature found live for Cherven Bryag. ~152 entries to check at
# Nominatim's 1.1s/request rate limit is a few minutes of real work.
#
# workflow_dispatch only - this is a one-time catch-up job for cache
# entries that predate geo_utils.Geocoder.geocode()'s own cross-check
# (which protects every future geocode call automatically); re-run only
# if a future audit finds more pre-existing entries worth re-checking.
# Shares scrape.yml's concurrency group since it writes to data/*.json
# and commits, same as any other backfill.
name: Verify geocode qualifiers (one-time correction)

on:
  workflow_dispatch:

concurrency:
  group: scrape-property-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python verify_geocode_qualifiers.py
        timeout-minutes: 30

      - if: always()
        run: |
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Correct geocode qualifier mismatches (one-time verification pass)"
          git pull --rebase origin main
          git push
