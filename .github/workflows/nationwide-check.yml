name: TEMP nationwide scale check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests playwright
      - run: playwright install --with-deps chromium

      - name: requests-based sites
        run: python nationwide_check.py

      - name: playwright-based sites
        run: python nationwide_check_pw.py
