# Daily check for due manual reminders (backlog stage 8) - see
# check_reminders.py for the full mechanism. A reminder always shows on the
# site's own Dashboard regardless of this workflow; this is the "also nudge
# me outside the site" half, via a GitHub issue (this repo's owner already
# gets GitHub's own email notification for a new issue, so no email
# service/API key is needed here at all).
#
# check_reminders.py exits non-zero on ANY failure to check or notify (a
# Supabase query error, a GitHub API error) - never silently exits 0 with
# nothing done, so a broken reminder pipeline shows up as a failed run the
# same way every other scheduled workflow in this project already does,
# per explicit requirement: this must not become a silent-failure surface.
name: Check reminders

on:
  schedule:
    # 10:00 UTC - inside the ~09:15-12:00 gap between scrape-large.yml
    # ending and scrape.yml's own 12:00 UTC window (see audit-cross-city-
    # merges.yml's own comment for the full daily schedule map), and a
    # different gap than that audit's own 15:45 UTC slot so the two daily
    # jobs aren't clustered together for no reason.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python check_reminders.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
