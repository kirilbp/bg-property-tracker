# Temporary diagnostic workflow, decisive follow-up to CHECK 2 in
# probe-deeper-history.yml: imot.bg's search/category page has 18 real
# Wayback captures (Apr 2025 - Jul 2026), unlike individual listing pages.
# This retries the CDX lookups that failed with transient 503/timeout
# errors, then fetches real archived category-page snapshots and checks
# whether the listing IDs on them still overlap with what we currently
# track - the decisive test before building any real extraction logic.
# Read-only, no commit step. Delete once the question is answered.
name: Probe Wayback category-page overlap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python probe_wayback_category.py
